# JavaScript SAST rules — our own ast-grep rule pack (MIT engine).
# Authored with OWASP Top 10 / CWE Top 25 as a coverage guide, never copied.
# Severity convention: error → HIGH (dangerous sink), warning → MEDIUM,
# info → LOW (review/audit). v1 is structural single-file; inter-procedural
# taint is v2. Keep FP low — only patterns that represent a real threat.

# ── Code injection (CWE-94/95) ──────────────────────────────────────────────
id: js-eval-call
language: javascript
severity: error
message: eval() executes arbitrary code — a code-injection sink with any non-constant input (CWE-95).
rule: { pattern: eval($ARG) }
---
id: js-function-constructor
language: javascript
severity: warning
message: The Function constructor compiles a string to code — equivalent to eval (CWE-95).
rule: { pattern: new Function($$$ARGS) }
---
id: js-settimeout-string
language: javascript
severity: warning
message: setTimeout/setInterval with a string argument evaluates it as code like eval (CWE-95).
rule:
  any:
    - pattern: setTimeout($CODE, $$$REST)
    - pattern: setInterval($CODE, $$$REST)
constraints:
  CODE: { kind: string }

# ── Command injection (CWE-78) ──────────────────────────────────────────────
---
id: js-child-process-exec-template
language: javascript
severity: error
message: child_process.exec with an interpolated command string is a command-injection sink — use execFile with an argv array (CWE-78).
rule:
  any:
    - pattern: $OBJ.exec(`$$$PARTS`)
    - pattern: $OBJ.execSync(`$$$PARTS`)
---
id: js-child-process-exec-concat
language: javascript
severity: error
message: child_process.exec with a concatenated command string is a command-injection sink — use execFile with an argv array (CWE-78).
rule:
  any:
    - pattern: $OBJ.exec($A + $B)
    - pattern: $OBJ.execSync($A + $B)

# ── SQL injection (CWE-89) ──────────────────────────────────────────────────
---
id: js-sql-query-template
language: javascript
severity: error
message: SQL query built with a template literal interpolates values directly into SQL — use parameterized queries (CWE-89).
rule:
  any:
    - pattern: $DB.query(`$$$PARTS`)
    - pattern: $DB.execute(`$$$PARTS`)
---
id: js-sql-query-concat
language: javascript
severity: error
message: SQL query built by string concatenation interpolates values into SQL — use parameterized queries (CWE-89).
rule:
  any:
    - pattern: $DB.query($A + $B)
    - pattern: $DB.execute($A + $B)

# ── NoSQL injection (CWE-943) ───────────────────────────────────────────────
---
id: js-nosql-where-operator
language: javascript
severity: error
message: MongoDB $where / $function with non-constant input runs server-side JS — a NoSQL injection + code-execution sink (CWE-943).
rule:
  any:
    - pattern: "{ $where: $V }"
    - pattern: "{ $function: $V }"

# ── Unsafe deserialization (CWE-502) ────────────────────────────────────────
---
id: js-node-serialize-unserialize
language: javascript
severity: error
message: node-serialize unserialize() on untrusted data executes embedded functions — remote code execution (CWE-502).
rule: { pattern: $X.unserialize($ARG) }

# ── XSS sinks (CWE-79) ──────────────────────────────────────────────────────
---
id: js-dom-innerhtml
language: javascript
severity: warning
message: Assigning to innerHTML/outerHTML with non-constant data is a DOM XSS sink — sanitize or use textContent (CWE-79).
rule:
  any:
    - pattern: $EL.innerHTML = $X
    - pattern: $EL.outerHTML = $X
---
id: js-document-write
language: javascript
severity: warning
message: document.write with non-constant data is a DOM XSS sink (CWE-79).
rule: { pattern: document.write($X) }
---
id: js-insert-adjacent-html
language: javascript
severity: warning
message: insertAdjacentHTML with non-constant data is a DOM XSS sink — sanitize first (CWE-79).
rule:
  pattern: $EL.insertAdjacentHTML($POS, $HTML)

# ── Weak crypto (CWE-327) ───────────────────────────────────────────────────
---
id: js-weak-hash-md5
language: javascript
severity: warning
message: MD5 is cryptographically broken — use SHA-256+ for security contexts (CWE-327).
rule:
  any:
    - pattern: $X.createHash('md5')
    - pattern: $X.createHash("md5")
    - pattern: createHash('md5')
    - pattern: createHash("md5")
---
id: js-weak-hash-sha1
language: javascript
severity: warning
message: SHA-1 is cryptographically broken — use SHA-256+ for security contexts (CWE-327).
rule:
  any:
    - pattern: $X.createHash('sha1')
    - pattern: $X.createHash("sha1")
    - pattern: createHash('sha1')
    - pattern: createHash("sha1")

# ── Disabled TLS verification (CWE-295) ─────────────────────────────────────
---
id: js-tls-reject-unauthorized-false
language: javascript
severity: error
message: rejectUnauthorized:false disables TLS certificate validation, enabling MITM (CWE-295).
rule:
  pattern:
    context: "({ rejectUnauthorized: false })"
    selector: pair
---
id: js-tls-node-env-disable
language: javascript
severity: error
message: Setting NODE_TLS_REJECT_UNAUTHORIZED=0 disables TLS verification process-wide, enabling MITM (CWE-295).
rule:
  any:
    - pattern: process.env.NODE_TLS_REJECT_UNAUTHORIZED = '0'
    - pattern: process.env.NODE_TLS_REJECT_UNAUTHORIZED = "0"

# ── Insecure randomness (CWE-338) ───────────────────────────────────────────
---
id: js-insecure-random
language: javascript
severity: info
message: Math.random() is not cryptographically secure — use crypto.randomBytes/randomUUID for tokens, keys, or IDs (CWE-338).
rule: { pattern: Math.random() }

# ── SSRF (CWE-918) ──────────────────────────────────────────────────────────
---
id: js-ssrf-url-concat
language: javascript
severity: warning
message: HTTP request to a URL built by string concatenation may be attacker-controlled (SSRF) — validate the host against an allowlist (CWE-918).
rule:
  any:
    - pattern: axios.get($A + $B)
    - pattern: axios.post($A + $B)
    - pattern: axios($A + $B)
    - pattern: fetch($A + $B)
    - pattern: http.get($A + $B)
    - pattern: https.get($A + $B)
    - pattern: http.request($A + $B)
    - pattern: https.request($A + $B)

# ── Path traversal (CWE-22) ─────────────────────────────────────────────────
---
id: js-path-traversal-concat
language: javascript
severity: warning
message: File path built by string concatenation may escape the intended directory (path traversal) — normalize and confine under a base directory (CWE-22).
rule:
  any:
    - pattern: fs.readFile($A + $B)
    - pattern: fs.readFileSync($A + $B)
    - pattern: fs.createReadStream($A + $B)
    - pattern: fs.writeFile($A + $B)
    - pattern: fs.writeFileSync($A + $B)
    - pattern: fs.unlink($A + $B)
    - pattern: fs.unlinkSync($A + $B)

---
id: js-vm-run
language: javascript
severity: error
message: vm.runInContext/runInNewContext/runInThisContext executes a string as code — a code-execution sink with any non-constant input (CWE-94).
rule:
  any:
    - pattern: vm.runInThisContext($$$ARGS)
    - pattern: vm.runInNewContext($$$ARGS)
    - pattern: vm.runInContext($$$ARGS)
---
id: js-weak-cipher-algo
language: javascript
severity: warning
message: Weak/broken cipher algorithm (DES/RC4/ECB) selected for createCipheriv — use AES-GCM or another authenticated cipher (CWE-327).
rule:
  pattern: crypto.createCipheriv($ALGO, $$$REST)
constraints:
  ALGO:
    regex: '(?i)(des|rc4|ecb|rc2)'
---
id: js-weak-cipher-createcipher
language: javascript
severity: warning
message: crypto.createCipher is deprecated and derives keys insecurely (MD5, no IV) — use createCipheriv with a random IV (CWE-327).
rule:
  pattern: crypto.createCipher($$$ARGS)
---
id: js-pseudo-random-bytes
language: javascript
severity: warning
message: crypto.pseudoRandomBytes is not cryptographically secure — use crypto.randomBytes for tokens, keys, or IVs (CWE-338).
rule:
  pattern: crypto.pseudoRandomBytes($$$ARGS)
---
id: js-cors-wildcard
language: javascript
severity: warning
message: CORS configured with a wildcard or reflected origin (origin "*" or true) allows any site to read authenticated responses (CWE-942).
rule:
  any:
    - pattern:
        context: 'cors({ origin: "*" })'
        selector: pair
    - pattern:
        context: "cors({ origin: true })"
        selector: pair
---
id: js-cookie-insecure-flag
language: javascript
severity: warning
message: Cookie set with secure:false or httpOnly:false weakens session protection (transport exposure / JS theft) (CWE-614).
rule:
  any:
    - pattern:
        context: "x({ secure: false })"
        selector: pair
    - pattern:
        context: "x({ httpOnly: false })"
        selector: pair
---
id: js-postmessage-star
language: javascript
severity: warning
message: postMessage with targetOrigin "*" broadcasts the message to any origin — pin an explicit origin (CWE-345).
rule:
  pattern: $W.postMessage($MSG, "*")
---
id: js-tls-env-reject
language: javascript
severity: error
message: Setting NODE_TLS_REJECT_UNAUTHORIZED=0 disables TLS verification process-wide, enabling MITM (CWE-295).
rule:
  any:
    - pattern: process.env.NODE_TLS_REJECT_UNAUTHORIZED = "0"
    - pattern: process.env.NODE_TLS_REJECT_UNAUTHORIZED = '0'
---
id: js-jwt-alg-none
language: javascript
severity: error
message: JWT configured with the "none" algorithm disables signature verification — anyone can forge tokens (CWE-347).
rule:
  any:
    - pattern:
        context: 'jwt.sign(p, k, { algorithm: "none" })'
        selector: pair
    - pattern:
        context: 'jwt.verify(t, k, { algorithms: ["none"] })'
        selector: pair
---
id: js-require-non-literal
language: javascript
severity: info
message: require() with a non-literal argument can load attacker-controlled modules — pass a constant module path (CWE-95).
rule:
  pattern: require($MOD)
constraints:
  MOD: { not: { kind: string } }
---
id: js-electron-node-integration
language: javascript
severity: error
message: Electron BrowserWindow with nodeIntegration:true or contextIsolation:false exposes Node APIs to renderer content — remote pages can run native code (CWE-1188).
rule:
  any:
    - pattern:
        context: "new BrowserWindow({ webPreferences: { nodeIntegration: true } })"
        selector: pair
    - pattern:
        context: "new BrowserWindow({ webPreferences: { contextIsolation: false } })"
        selector: pair
---
id: js-express-open-redirect
language: javascript
severity: warning
message: res.redirect with a request-derived value enables open redirect / phishing — validate the target against an allowlist (CWE-601).
rule:
  pattern: res.redirect($X)
  has:
    any:
      - pattern: req.query
      - pattern: req.params
      - pattern: req.body
    stopBy: end
---
id: js-hardcoded-jwt-secret
language: javascript
severity: warning
message: JWT signing secret is a hardcoded string literal — extract it to a secret store / env var (CWE-798).
rule:
  pattern: jwt.sign($PAYLOAD, $SECRET)
constraints:
  SECRET: { kind: string }
---
id: js-sequelize-raw-query
language: javascript
severity: warning
message: ORM raw query (sequelize.query/knex.raw) with a non-literal SQL string may interpolate untrusted input — use bind parameters (CWE-89).
rule:
  any:
    - pattern: $DB.query($Q)
    - pattern: $DB.raw($Q)
constraints:
  Q:
    not:
      any:
        - kind: string
        - kind: template_string
---
id: js-location-javascript-url
language: javascript
severity: warning
message: Assigning a javascript URL scheme to location/href executes script — a DOM XSS sink (CWE-79).
rule:
  any:
    - pattern: $L.href = $URL
    - pattern: location.href = $URL
constraints:
  URL:
    regex: "javascript:"
