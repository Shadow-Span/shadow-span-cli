# C# SAST rules — our own ast-grep rule pack (MIT engine).
# Coverage guide: OWASP Top 10 / CWE Top 25. error → HIGH, warning → MEDIUM.

# ── Command injection (CWE-78) ──────────────────────────────────────────────
id: csharp-process-start
language: csharp
severity: warning
message: Process.Start with a non-constant filename/arguments can execute attacker-controlled commands — validate against an allowlist (CWE-78).
rule:
  any:
    - pattern: Process.Start($X)
    - pattern: System.Diagnostics.Process.Start($X)
    - pattern: Process.Start($X, $ARGS)

# ── SQL injection (CWE-89) ──────────────────────────────────────────────────
---
id: csharp-sql-concat
language: csharp
severity: error
message: SqlCommand built by string concatenation interpolates values into SQL — use parameterized commands with SqlParameter (CWE-89).
rule:
  any:
    - pattern: new SqlCommand($A + $B)
    - pattern: new SqlCommand($A + $B, $$$R)
---
id: csharp-sql-interpolated
language: csharp
severity: error
message: SqlCommand built from an interpolated string injects values into SQL — use parameterized commands with SqlParameter (CWE-89).
rule:
  all:
    - pattern: new SqlCommand($$$ARGS)
    - has:
        kind: interpolated_string_expression
        stopBy: end

# ── Unsafe deserialization (CWE-502) ────────────────────────────────────────
---
id: csharp-insecure-deserializer
language: csharp
severity: error
message: BinaryFormatter/SoapFormatter/NetDataContractSerializer/LosFormatter on untrusted data execute gadget chains — use System.Text.Json or DataContractSerializer with known types (CWE-502).
rule:
  any:
    - pattern: new BinaryFormatter()
    - pattern: new SoapFormatter()
    - pattern: new NetDataContractSerializer()
    - pattern: new LosFormatter()

# ── XXE (CWE-611) ───────────────────────────────────────────────────────────
---
id: csharp-xxe-dtd-parse
language: csharp
severity: error
message: DtdProcessing.Parse enables DTD/external-entity processing — an XXE sink. Use DtdProcessing.Prohibit and a null XmlResolver (CWE-611).
rule: { pattern: DtdProcessing.Parse }

# ── Weak crypto (CWE-327) ───────────────────────────────────────────────────
---
id: csharp-weak-hash-md5
language: csharp
severity: warning
message: MD5 is cryptographically broken — use SHA256 for security contexts (CWE-327).
rule:
  any:
    - pattern: MD5.Create()
    - pattern: new MD5CryptoServiceProvider()
---
id: csharp-weak-hash-sha1
language: csharp
severity: warning
message: SHA-1 is cryptographically broken — use SHA256 for security contexts (CWE-327).
rule:
  any:
    - pattern: SHA1.Create()
    - pattern: new SHA1CryptoServiceProvider()
---
id: csharp-weak-cipher-des
language: csharp
severity: warning
message: DES/3DES is obsolete and weak — use AES (Aes.Create) with an authenticated mode (CWE-327).
rule:
  any:
    - pattern: DES.Create()
    - pattern: new DESCryptoServiceProvider()
    - pattern: TripleDES.Create()

# ── Disabled TLS verification (CWE-295) ─────────────────────────────────────
---
id: csharp-tls-accept-all-certs
language: csharp
severity: error
message: Assigning a custom server-certificate validation callback (commonly "return true") disables TLS validation, enabling MITM (CWE-295).
rule:
  any:
    - pattern:
        context: "class C { void m(){ ServicePointManager.ServerCertificateValidationCallback = $X; } }"
        selector: assignment_expression
    - pattern:
        context: "class C { void m(){ $H.ServerCertificateCustomValidationCallback = $X; } }"
        selector: assignment_expression

# ── Insecure randomness (CWE-338) ───────────────────────────────────────────
---
id: csharp-insecure-random
language: csharp
severity: info
message: System.Random is predictable — use RandomNumberGenerator for tokens, keys, nonces, or IDs (CWE-338).
rule: { pattern: new Random($$$A) }

# ── SSRF (CWE-918) ──────────────────────────────────────────────────────────
---
id: csharp-ssrf-url-concat
language: csharp
severity: warning
message: Request to a URL built by string concatenation may be attacker-controlled (SSRF) — validate the host against an allowlist (CWE-918).
rule:
  any:
    - pattern: WebRequest.Create($A + $B)
    - pattern: new Uri($A + $B)

# ── Path traversal (CWE-22) ─────────────────────────────────────────────────
---
id: csharp-path-traversal-concat
language: csharp
severity: warning
message: File path built by string concatenation may escape the intended directory (path traversal) — canonicalize with Path.GetFullPath and confine under a base directory (CWE-22).
rule:
  any:
    - pattern: File.ReadAllText($A + $B)
    - pattern: File.ReadAllBytes($A + $B)
    - pattern: File.OpenRead($A + $B)

---
# ── Weak cipher / mode (CWE-327) ─────────────────────────────────────────────
id: cs-weak-cipher-des-ecb
language: csharp
severity: warning
message: RC2 is a weak cipher and ECB block-cipher mode leaks plaintext structure — use AES (Aes.Create) with an authenticated (GCM) or CBC mode (CWE-327).
rule:
  any:
    - pattern: RC2.Create()
    - pattern: CipherMode.ECB

# ── Unsafe deserializers (CWE-502) ───────────────────────────────────────────
---
id: cs-jsserializer-typeresolver
language: csharp
severity: error
message: JavaScriptSerializer with a SimpleTypeResolver resolves arbitrary types from input, enabling deserialization gadget attacks — remove the resolver (CWE-502).
rule:
  pattern: new JavaScriptSerializer(new SimpleTypeResolver())
---
id: cs-json-typenamehandling
language: csharp
severity: error
message: Json.NET TypeNameHandling other than None resolves CLR types embedded in JSON, enabling deserialization RCE — set TypeNameHandling.None or use a strict SerializationBinder (CWE-502).
rule:
  any:
    - pattern: TypeNameHandling.All
    - pattern: TypeNameHandling.Auto
    - pattern: TypeNameHandling.Objects

# ── XXE (CWE-611) ────────────────────────────────────────────────────────────
---
id: cs-xxe-dtdprocessing-allow
language: csharp
severity: error
message: DtdProcessing.Allow enables DTD and external-entity processing — an XXE sink. Use DtdProcessing.Prohibit and a null XmlResolver (CWE-611).
rule:
  pattern: DtdProcessing.Allow

# ── Reflected XSS via raw HTML (CWE-79) ──────────────────────────────────────
---
id: cs-html-raw-xss
language: csharp
severity: warning
message: Html.Raw on a non-literal value emits unencoded markup and is a reflected/stored XSS sink — HTML-encode the value or avoid Raw (CWE-79).
rule:
  any:
    - pattern: Html.Raw($X)
    - pattern: "@Html.Raw($X)"
constraints:
  X:
    not:
      any:
        - regex: '^"[^"]*"$'
        - regex: '^@"[^"]*"$'
        - regex: "^'[^']*'$"

# ── Open redirect (CWE-601) ──────────────────────────────────────────────────
---
id: cs-open-redirect
language: csharp
severity: warning
message: Redirecting to a non-literal URL lets an attacker control the destination (open redirect) — validate against an allowlist of local paths/hosts (CWE-601).
rule:
  any:
    - pattern: Response.Redirect($X)
    - pattern: Redirect($X)
constraints:
  X:
    not:
      any:
        - regex: '^"[^"]*"$'
        - regex: '^@"[^"]*"$'
        - regex: "^'[^']*'$"

# ── LDAP injection (CWE-90) ──────────────────────────────────────────────────
---
id: cs-ldap-injection
language: csharp
severity: warning
message: DirectorySearcher built from a non-literal filter is an LDAP injection sink — escape the filter with proper LDAP encoding (CWE-90).
rule:
  pattern: new DirectorySearcher($X)
constraints:
  X:
    not:
      any:
        - regex: '^"[^"]*"$'
        - regex: '^@"[^"]*"$'
        - regex: "^'[^']*'$"

# ── XPath injection (CWE-643) ────────────────────────────────────────────────
---
id: cs-xpath-injection
language: csharp
severity: warning
message: SelectNodes/SelectSingleNode with a non-literal XPath expression is an XPath injection sink — parameterize or validate the expression (CWE-643).
rule:
  any:
    - pattern: $N.SelectNodes($X)
    - pattern: $N.SelectSingleNode($X)
constraints:
  X:
    not:
      any:
        - regex: '^"[^"]*"$'
        - regex: '^@"[^"]*"$'
        - regex: "^'[^']*'$"

# ── Weak TLS/SSL protocols (CWE-326) ─────────────────────────────────────────
---
id: cs-weak-ssl-protocols
language: csharp
severity: warning
message: SSLv3 / TLS 1.0 / TLS 1.1 are deprecated and weak — require TLS 1.2 or 1.3 (CWE-326).
rule:
  any:
    - pattern: SslProtocols.Ssl3
    - pattern: SslProtocols.Tls
    - pattern: SslProtocols.Tls11
    - pattern: SecurityProtocolType.Ssl3

# ── Insecure cookie flags (CWE-614) ──────────────────────────────────────────
---
id: cs-cookie-insecure
language: csharp
severity: warning
message: Cookies set with Secure=false or HttpOnly=false expose session data over plaintext or to script — enable both flags for auth/session cookies (CWE-614).
rule:
  any:
    - pattern: Secure = false
    - pattern: HttpOnly = false

# ── Permissive CORS (CWE-942) ────────────────────────────────────────────────
---
id: cs-cors-wildcard
language: csharp
severity: warning
message: A wildcard CORS origin (AllowAnyOrigin / WithOrigins("*")) lets any site read authenticated responses — restrict to an explicit origin allowlist (CWE-942).
rule:
  any:
    - pattern: $X.AllowAnyOrigin()
    - pattern: $X.WithOrigins("*")

# ── ReDoS: Regex without timeout (CWE-1333) ──────────────────────────────────
---
id: cs-regex-no-timeout
language: csharp
severity: info
message: Regex constructed without a matchTimeout can be driven to catastrophic backtracking (ReDoS) on attacker-supplied input — pass a TimeSpan timeout (CWE-1333).
rule:
  pattern: new Regex($P)

# ── XSLT script execution (CWE-94) ───────────────────────────────────────────
---
id: cs-xslt-enable-script
language: csharp
severity: error
message: XsltSettings with EnableScript=true allows embedded script in an XSLT stylesheet to execute (code injection) — disable script and document() resolution (CWE-94).
rule:
  any:
    - pattern: new XsltSettings(true, true)
    - pattern: EnableScript = true

# ── Weak RSA key size (CWE-326) ──────────────────────────────────────────────
---
id: cs-weak-rsa-keysize
language: csharp
severity: warning
message: RSA key sizes below 2048 bits are inadequate — use at least 2048-bit keys (CWE-326).
rule:
  any:
    - pattern: new RSACryptoServiceProvider(1024)
    - pattern: new RSACryptoServiceProvider(512)

# ── Disabled anti-forgery (CWE-352) ──────────────────────────────────────────
---
id: cs-antiforgery-ignore
language: csharp
severity: warning
message: "[IgnoreAntiforgeryToken] disables CSRF protection on a state-changing action — remove it or scope it to safe, idempotent endpoints (CWE-352)."
rule:
  pattern:
    context: "class C { [IgnoreAntiforgeryToken] void M() {} }"
    selector: attribute

# ── Disabled request validation (CWE-20) ─────────────────────────────────────
---
id: cs-validateinput-false
language: csharp
severity: warning
message: "[ValidateInput(false)] turns off ASP.NET request validation, removing a defense-in-depth XSS guard — keep validation on and encode output (CWE-20)."
rule:
  pattern:
    context: "class C { [ValidateInput(false)] void M() {} }"
    selector: attribute
